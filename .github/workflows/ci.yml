name: CI

on:
  push:
  pull_request:

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      # Brain 2.0 modules are stdlib-only at import time (LLM SDKs are
      # imported lazily), so the offline test suite needs nothing else.
      - name: Run offline test suites
        run: python -m pytest -q tests/test_brain.py tests/test_email_browser.py

      - name: Syntax-check touched modules
        run: python -m py_compile agent/planner.py agent/executor.py agent/error_handler.py core/long_term_memory.py actions/email_agent.py actions/email_browser.py main.py
