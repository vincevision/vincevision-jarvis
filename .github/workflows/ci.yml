name: CI

on:
  push:
  pull_request:

jobs:
  brain-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --upgrade pip pytest

      # Brain 2.0 modules are stdlib-only at import time (LLM SDKs are
      # imported lazily), so the offline test suite needs nothing else.
      - name: Run offline test suites
        run: python -m pytest -q tests/test_brain.py tests/test_email_browser.py tests/test_social_browser.py tests/test_productivity_pack.py tests/test_pentest_kit.py tests/test_cloud_integrations.py tests/test_clone_ready.py tests/test_uninstall.py tests/test_api_key_setup.py tests/test_pc_controller.py

      - name: Syntax-check touched modules
        run: python -m py_compile agent/planner.py agent/executor.py agent/error_handler.py core/long_term_memory.py actions/email_agent.py actions/email_browser.py actions/social_browser.py actions/social_login.py actions/instagram_agent.py actions/notes_agent.py actions/system_agent.py actions/briefing_agent.py actions/scope_agent.py actions/findings_agent.py actions/report_agent.py actions/google_auth.py actions/gmail_agent.py actions/calendar_agent.py actions/docs_agent.py actions/drive_agent.py actions/notion_agent.py core/api_key_setup.py core/credential_manager.py actions/pc_controller.py core/daemon.py doctor.py uninstall.py main.py
